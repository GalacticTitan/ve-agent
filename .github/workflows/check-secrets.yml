# Temporary: says whether each secret the build needs is set (true/false only).
name: check-secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.R2_ACCESS_KEY_ID }}
          B: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          C: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          echo "R2_ACCESS_KEY_ID set: $([ -n "$A" ] && echo yes || echo no) (length ${#A})"
          echo "R2_SECRET_ACCESS_KEY set: $([ -n "$B" ] && echo yes || echo no) (length ${#B})"
          echo "MINISIGN_SECRET_KEY set: $([ -n "$C" ] && echo yes || echo no)"
